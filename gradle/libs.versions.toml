[versions]
agp = "9.2.1"
kotlin = "2.2.10"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
# Motion-Prediction für latenzarmes Ink am Board (MotionEventPredictor).
inputMotionprediction = "1.0.0-beta05"
okhttp = "4.12.0"
# Desktop-Client: Compose Multiplatform (Linux/Windows/macOS aus einer Codebasis).
composeMultiplatform = "1.11.1"
# material3 hat einen eigenen Versionsstrang, nicht den von Compose Multiplatform.
composeMaterial3 = "1.9.0"
# Symbolsatz; letzte Fassung dieses Artefakts — für ein paar Symbole ausreichend.
composeIcons = "1.7.3"
# PDF-Seiten zu Bildern rendern („Ausdruck"). Nur im Desktop-Client — das Board
# bekommt fertige Bilder und braucht keinen PDF-Renderer.
pdfbox = "3.0.8"
# org.json ist auf Android eingebaut, auf der JVM nicht — für shared/desktop nötig.
json = "20250517"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-input-motionprediction = { group = "androidx.input", name = "input-motionprediction", version.ref = "inputMotionprediction" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
json = { group = "org.json", name = "json", version.ref = "json" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }
pdfbox = { group = "org.apache.pdfbox", name = "pdfbox", version.ref = "pdfbox" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMaterial3" }
compose-icons = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "composeIcons" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
